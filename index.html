<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f6fb2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Armstrong Creek — Timesheet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f6f8fa; --panel:#ffffff; --ink:#1f2a37; --muted:#6b7785;
    --line:#dde4ea; --accent:#1f6fb2; --accent-soft:#eaeef2;
    --warn:#b4541f; --warn-soft:#fbeee6; --l2:#1f6fb2; --l1e:#3a6ea5; --l1w:#7c8a9c;
    --nav-h:60px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
  body{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
  input,select,button{font:inherit}
  .top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
  .top h1{margin:0;font-size:17px;font-weight:600;flex:1}
  .top .mini{font-size:12px;opacity:.85}
  .top .topbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
  main{padding:14px 14px 24px;max-width:680px;margin:0 auto}
  .screen{display:none}.screen.active{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.05)}
  label.fld{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  select.big,input.big{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
  .selrow{display:flex;gap:8px;align-items:flex-end}
  .selrow .grow{flex:1}
  .wkstep{display:flex;gap:8px;align-items:center;margin-top:10px}
  .wkstep button{flex:0 0 48px;height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:20px;color:var(--accent)}
  .wkstep .wklabel{flex:1;text-align:center;font-weight:600;color:var(--accent)}
  .day{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;background:#fff}
  .day .dh{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .day.weekend .dh{background:#eef0f2}
  .day .dh .dt{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
  .day .db{padding:12px;display:flex;flex-direction:column;gap:10px}
  .line{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:#fff}
  .line.wastage{border-color:var(--warn);background:var(--warn-soft)}
  .line.empty{border-color:var(--warn)}
  .line select.alloc{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}
  .line select.who{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px}
  .line.wastage select.alloc{color:var(--warn);font-weight:600}
  .line .l2{display:flex;gap:8px;align-items:center}
  .line .hwrap{display:flex;align-items:center;gap:5px}
  .line .hwrap label{font-size:13px;color:var(--muted)}
  .line input.hrs{width:74px;text-align:right;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px}
  .line input.note{flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  .line .del{flex:0 0 auto;border:none;background:none;color:var(--warn);font-size:14px;padding:8px;text-decoration:underline}
  .line.locked{background:#eef0f2;border-color:#cdddd2;opacity:.95}
  .line .appr{width:100%;padding:10px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
  .line .appr.unappr{background:#fff;color:var(--accent)}
  .line .lockbadge{display:inline-block;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
  .line .stamp{font-size:11px;color:var(--muted);padding:2px 0}
  .addline{width:100%;padding:11px;border:1px dashed var(--accent);border-radius:10px;background:transparent;color:var(--accent);font-size:15px;font-weight:600}
  .pgroup{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
  .pgroup:first-child{border-top:none;padding-top:0}
  .phead{display:flex;justify-content:space-between;font-weight:700;color:var(--accent);font-size:14px;margin:0 2px}
  select.addperson{width:100%;padding:11px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px}
  .wtotal{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:10;
    background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .wtotal b{font-size:18px}
  .wtotal .warnchip{background:#fff;color:var(--warn);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi .k{background:var(--accent-soft);border-radius:12px;padding:13px}
  .kpi .k.warn{background:var(--warn-soft)}
  .kpi .k .lbl{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
  .kpi .k.warn .lbl{color:var(--warn)}
  .kpi .k .v{font-size:22px;font-weight:700;margin-top:2px}
  .kpi .k .t{font-size:11px;color:var(--muted)}
  h2.sec{font-size:14px;margin:18px 2px 8px}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
  .item .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item .nm{font-weight:600;font-size:14px}
  .item .tot{font-variant-numeric:tabular-nums;font-weight:700}
  .item .wk{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .chip{font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:2px 9px}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .pill.L2{background:rgba(105,120,138,.16);color:var(--l2)}
  .pill.L1E{background:rgba(105,120,138,.16);color:var(--l1e)}
  .pill.L1W{background:rgba(105,120,138,.16);color:var(--l1w)}
  .pill.W{background:var(--warn-soft);color:var(--warn)}
  .zhead{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.5px;margin:14px 2px 6px}
  .muted{color:var(--muted)}.small{font-size:13px}
  .prow{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .prow input.nm{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  .prow input.rate{width:74px;padding:10px;border:1px solid var(--line);border-radius:9px;text-align:right;font-size:15px}
  .btn{display:block;width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:15px;color:var(--ink);margin-top:8px;text-align:center}
  .btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.warn{color:var(--warn)}
  /* bottom nav */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex}
  nav.bottom button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:var(--muted);font-size:11.5px;padding:6px 0}
  nav.bottom button .ic{font-size:21px;line-height:1}
  nav.bottom button.active{color:var(--accent);font-weight:600}
  /* login + status */
  .login{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:22px}
  .loginbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:11px}
  .loginbox h2{margin:0;color:var(--accent)}
  .loginbox p{margin:0;font-size:14px;color:var(--muted)}
  .loginbox input{padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}
  .loginbox button{background:var(--accent);border:none;color:#fff;padding:14px;border-radius:10px;font-weight:600;font-size:16px}
  .err{color:var(--warn);font-size:13px;min-height:17px}
  #banner{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:90;
    background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;font-size:14px;max-width:90%}
  #loading{position:fixed;inset:0;background:rgba(244,246,244,.9);z-index:70;display:none;align-items:center;justify-content:center;color:var(--muted)}
</style>
</head>
<body>
<div class="login" id="login" style="display:none">
  <form class="loginbox" id="loginForm">
    <h2>Armstrong Creek</h2>
    <p>Sign in with your shared crew login.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" inputmode="email" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>
<div id="loading">Loading…</div>
<div id="banner"></div>

<div class="top">
  <h1>Armstrong Creek</h1>
  <span class="mini" id="who"></span>
  <button class="topbtn" id="topSignout">Sign out</button>
</div>

<main>
  <!-- TIMESHEET -->
  <section class="screen active" id="s-ts">
    <div class="card">
      <div class="selrow">
        <div class="grow">
          <label class="fld">Person</label>
          <select class="big" id="selPerson"></select>
        </div>
      </div>
      <div class="wkstep">
        <button id="wkPrev" aria-label="Previous week">‹</button>
        <div class="wklabel" id="wkLabel">—</div>
        <button id="wkNext" aria-label="Next week">›</button>
      </div>
    </div>
    <div id="dayList"></div>
    <div class="wtotal" id="wtotal"></div>
  </section>

  <!-- TOTALS -->
  <section class="screen" id="s-tot">
    <div class="card"><div class="kpi" id="kpis"></div></div>
    <h2 class="sec">Hours by item</h2>
    <div id="itemTotals"></div>
    <h2 class="sec">By person</h2>
    <div id="personTotals"></div>
  </section>

  <!-- MORE -->
  <section class="screen" id="s-more">
    <div class="card">
      <h2 class="sec" style="margin-top:0">People</h2>
      <div id="peopleList"></div>
      <button class="btn" id="addPerson">+ Add person</button>
    </div>
    <div class="card">
      <h2 class="sec" style="margin-top:0">Weeks</h2>
      <div id="weekList" class="small muted"></div>
      <button class="btn" id="addWeek">+ Add week</button>
    </div>
    <div class="card">
      <h2 class="sec" style="margin-top:0">Data</h2>
      <button class="btn" id="reload">Reload from server</button>
      <button class="btn" id="csvTs">Export timesheet CSV</button>
      <button class="btn" id="csvCost">Export costing CSV</button>
      <button class="btn warn" id="signout">Sign out</button>
      <p class="small muted" style="margin:10px 2px 0">Live on Supabase · shared with everyone on the crew login.
        For materials &amp; full editing use the desktop version.</p>
    </div>
  </section>
</main>

<nav class="bottom" id="nav">
  <button data-s="ts" class="active"><span class="ic">📝</span>Timesheet</button>
  <button data-s="tot"><span class="ic">📊</span>Totals</button>
  <button data-s="more"><span class="ic">⋯</span>More</button>
</nav>

<script>
/* ===== SUPABASE (same project as the desktop version) ===== */
const SUPABASE_URL="https://kncijdujuvlzjfenstba.supabase.co";
const SUPABASE_KEY="sb_publishable_YAOafvAAp6ZUbSXEAMQPMA_INEUnJZl";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let PROJECT_ID=null;

let S={tasks:[],weeks:[],people:[],materials:[],timesheet:[],taskMaterials:{}};
let SEL={personId:localStorage.getItem("ac_person")||null, weekId:localStorage.getItem("ac_week")||null};
let CUR="ts";
let IS_ADMIN=false, CAN_APPROVE=false, CAN_SEE_COSTS=false, MY_LEVEL=0, MY_UID=null, MY_PERSON_ID=null;
const ROLE_NAMES={1:"Trade",2:"Foreman",3:"PM",4:"Admin"};

const fmt=(n)=>"$"+(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
const fmt1=(n)=>(n||0).toLocaleString(undefined,{maximumFractionDigits:1});
const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const ZONES=["L2","L1E","L1W"];
const person=(id)=>S.people.find(p=>p.id===id);
const task=(id)=>S.tasks.find(t=>t.id===id);
const weeksSorted=()=>[...S.weeks].sort((a,b)=>a.monday<b.monday?-1:1);
function uuid(){
  if(window.crypto&&crypto.randomUUID){try{return crypto.randomUUID();}catch(e){}}
  let b=new Uint8Array(16);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);
  b[6]=(b[6]&0x0f)|0x40;b[8]=(b[8]&0x3f)|0x80;
  const h=[];for(let i=0;i<16;i++)h.push(b[i].toString(16).padStart(2,"0"));
  return h.slice(0,4).join("")+"-"+h.slice(4,6).join("")+"-"+h.slice(6,8).join("")+"-"+h.slice(8,10).join("")+"-"+h.slice(10,16).join("");
}
function fmtDate(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function isoAdd(iso,n){const a=iso.split("-").map(Number);const dt=new Date(a[0],a[1]-1,a[2]);dt.setDate(dt.getDate()+n);return fmtDate(dt);}
const DAYNAMES=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function prettyDate(iso){const a=iso.split("-").map(Number);return a[2]+"/"+a[1];}

/* ===== DB ===== */
function banner(m){const b=document.getElementById("banner");b.textContent=m;b.style.display="block";clearTimeout(banner._t);banner._t=setTimeout(()=>b.style.display="none",3500);}
function dbErr(e){console.error(e);banner("Save failed — tap Reload. "+((e&&e.message)||e));}
async function dbInsert(t,r){const{error}=await sb.from(t).insert(r);if(error)dbErr(error);}
async function dbUpdate(t,id,p){const{error}=await sb.from(t).update(p).eq("id",id);if(error)dbErr(error);}
async function dbDelete(t,id){const{error}=await sb.from(t).delete().eq("id",id);if(error)dbErr(error);}
function tsRow(e){return {id:e.id,project_id:PROJECT_ID,person_id:e.personId,week_id:e.weekId,entry_date:e.date,
  task_id:(e.alloc&&e.alloc!=="WASTAGE")?e.alloc:null,is_wastage:e.alloc==="WASTAGE",hours:+e.hours||0,note:e.note||null};}

async function loadAll(){
  const {data:projects,error:pe}=await sb.from("projects").select("*").order("created_at");
  if(pe){dbErr(pe);return false;}
  if(!projects||!projects.length){banner("No project found — run the setup SQL first.");return false;}
  PROJECT_ID=projects[0].id;
  const [people,weeks,tasks,materials,ts,tm]=await Promise.all([
    sb.from("people").select("*").eq("project_id",PROJECT_ID),
    sb.from("weeks").select("*").eq("project_id",PROJECT_ID),
    sb.from("tasks").select("*").eq("project_id",PROJECT_ID).order("sort_order"),
    sb.from("materials").select("*").eq("project_id",PROJECT_ID),
    sb.from("timesheet_entries").select("*").eq("project_id",PROJECT_ID),
    sb.from("task_materials").select("*").eq("project_id",PROJECT_ID)
  ]);
  for(const r of [people,weeks,tasks,materials,ts,tm])if(r.error){dbErr(r.error);return false;}
  S.people=(people.data||[]).map(r=>({id:r.id,name:r.name,role:r.role||"",rate:+r.hourly_rate||0,active:r.active!==false,user_id:r.user_id||null,level:+r.role_level||1,
    subInv:r.subcontract_invoicing===true,gstReg:r.gst_registered===true,
    allowTravel:r.allow_travel===true,travelRate:+r.travel_rate||0,allowMeal:r.allow_meal===true,mealRate:+r.meal_rate||0,allowAccom:r.allow_accom===true,accomRate:+r.accom_rate||0}));
  S.weeks=(weeks.data||[]).map(r=>({id:r.id,monday:r.monday}));
  S.tasks=(tasks.data||[]).map(r=>({id:r.id,zone:r.zone,name:r.name,sort:r.sort_order}));
  S.materials=(materials.data||[]).map(r=>({id:r.id,name:r.name,unit:r.unit||"each",cost:+r.unit_cost||0}));
  S.timesheet=(ts.data||[]).map(r=>({id:r.id,personId:r.person_id,weekId:r.week_id,date:r.entry_date,
    alloc:r.is_wastage?"WASTAGE":(r.task_id||""),hours:+r.hours||0,note:r.note||"",approved:r.approved===true,enteredBy:r.entered_by||null,approvedBy:r.approved_by||null}));
  S.taskMaterials={};(tm.data||[]).forEach(r=>{(S.taskMaterials[r.task_id]=S.taskMaterials[r.task_id]||[]).push({id:r.id,materialId:r.material_id||"",qty:+r.quantity||0});});
  // default selection
  const ws=weeksSorted();
  if(SEL.personId!=="ALL"&&!S.people.some(p=>p.active&&p.id===SEL.personId))SEL.personId=(S.people.find(p=>p.active)||{}).id||null;
  if(!S.weeks.some(w=>w.id===SEL.weekId))SEL.weekId=(ws[ws.length-1]||{}).id||null; // default latest week
  return true;
}

/* ===== cost helpers ===== */
function rateOf(pid){const p=person(pid);return p?(+p.rate||0):0;}
function labourForTask(tid){let c=0,h=0;S.timesheet.forEach(e=>{if(e.alloc===tid){const hr=+e.hours||0;h+=hr;c+=hr*rateOf(e.personId);}});return{cost:c,hours:h};}
function materialForTask(tid){let c=0;(S.taskMaterials[tid]||[]).forEach(m=>{const mat=S.materials.find(x=>x.id===m.materialId);if(mat)c+=(+m.qty||0)*(+mat.cost||0);});return c;}
function wastageTotals(){let c=0,h=0;S.timesheet.forEach(e=>{if(e.alloc==="WASTAGE"){const hr=+e.hours||0;h+=hr;c+=hr*rateOf(e.personId);}});return{cost:c,hours:h};}
function unallocatedHours(){let h=0;S.timesheet.forEach(e=>{if(!e.alloc)h+=+e.hours||0;});return h;}
function taskWeekHours(alloc,wid){let h=0;S.timesheet.forEach(e=>{if(e.alloc===alloc&&e.weekId===wid)h+=+e.hours||0;});return h;}

/* ===== render ===== */
function render(){if(CUR==="ts")renderTS();else if(CUR==="tot")renderTotals();else renderMore();}

function renderTS(){
  const sp=document.getElementById("selPerson");
  if(!CAN_APPROVE&&SEL.personId==="ALL")SEL.personId=MY_PERSON_ID;
  const allOpt=CAN_APPROVE?`<option value="ALL" ${SEL.personId==="ALL"?"selected":""}>👥 All people</option>`:"";
  sp.innerHTML=allOpt
    +S.people.filter(p=>p.active||p.id===SEL.personId).map(p=>`<option value="${p.id}" ${p.id===SEL.personId?"selected":""}>${esc(p.name)}</option>`).join("");
  const ws=weeksSorted();const wk=S.weeks.find(w=>w.id===SEL.weekId)||ws[ws.length-1];
  if(wk)SEL.weekId=wk.id;
  document.getElementById("wkLabel").textContent=wk?("w/c "+wk.monday):"—";

  const list=document.getElementById("dayList");
  if(!SEL.personId||!wk){list.innerHTML="<div class='card muted'>Add a person and a week (More tab) to start.</div>";document.getElementById("wtotal").innerHTML="";return;}
  const ALL=SEL.personId==="ALL";
  let h="";
  for(let i=0;i<7;i++){
    const date=isoAdd(wk.monday,i);
    const dayE=ALL?S.timesheet.filter(e=>e.date===date):S.timesheet.filter(e=>e.personId===SEL.personId&&e.date===date);
    const dtot=dayE.reduce((a,e)=>a+(+e.hours||0),0);
    h+=`<div class='day ${i>=5?"weekend":""}'>
      <div class='dh'><span>${DAYNAMES[i]}<span class='dt'>${prettyDate(date)}</span></span><span>${fmt1(dtot)} h</span></div>
      <div class='db'>`;
    if(ALL){
      const pids=[...new Set(dayE.map(e=>e.personId))].sort((a,b)=>(((person(a)||{}).name||"").toLowerCase()<((person(b)||{}).name||"").toLowerCase())?-1:1);
      pids.forEach(pid=>{
        const pes=dayE.filter(e=>e.personId===pid);
        const ptot=pes.reduce((a,e)=>a+(+e.hours||0),0);
        h+=`<div class='pgroup'><div class='phead'><span>${esc((person(pid)||{}).name||"?")}</span><span>${fmt1(ptot)} h</span></div>`;
        pes.forEach(e=>h+=lineHtml(e));
        h+=`<button class='addline' onclick="tsAddFor('${pid}','${date}')">+ add line</button></div>`;
      });
      const present=new Set(pids);
      const absent=S.people.filter(p=>p.active&&!present.has(p.id));
      if(absent.length)h+=`<select class='addperson' onchange="if(this.value)tsAddFor(this.value,'${date}')"><option value=''>+ add person…</option>${absent.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>`;
    }else{
      dayE.forEach(e=>h+=lineHtml(e));
      h+=`<button class='addline' onclick="tsAdd('${date}')">+ add line</button>`;
    }
    h+=`</div></div>`;
  }
  list.innerHTML=h;

  const wTot=sumWeek(SEL.personId,SEL.weekId,null),wWaste=sumWeek(SEL.personId,SEL.weekId,"WASTAGE"),wUn=sumWeek(SEL.personId,SEL.weekId,"EMPTY");
  let f=`<span>Week: <b>${fmt1(wTot)} h</b></span><span style='opacity:.85'>Wastage ${fmt1(wWaste)} h</span>`;
  if(wUn>0)f+=`<span class='warnchip'>${fmt1(wUn)} h not allocated</span>`;
  document.getElementById("wtotal").innerHTML=f;
}
function sumWeek(pid,wid,filter){let h=0;S.timesheet.forEach(e=>{if(pid!=="ALL"&&e.personId!==pid)return;if(e.weekId!==wid)return;
  if(filter==="WASTAGE"&&e.alloc!=="WASTAGE")return;if(filter==="EMPTY"&&e.alloc)return;h+=+e.hours||0;});return h;}
function personOpts(sel){return S.people.filter(p=>p.active||p.id===sel).map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("");}
function allocOpts(sel){
  let o=`<option value="" ${!sel?"selected":""}>— choose task —</option>`;
  o+=`<option value="WASTAGE" ${sel==="WASTAGE"?"selected":""}>⚠ Wastage</option>`;
  ZONES.forEach(z=>{o+=`<optgroup label="${z}">`;
    S.tasks.filter(t=>t.zone===z).forEach(t=>o+=`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(t.name)}</option>`);o+="</optgroup>";});
  return o;
}
function lineHtml(e){
  const cls=e.alloc==="WASTAGE"?"wastage":(!e.alloc?"empty":"");
  const locked=e.approved, dis=locked?"disabled":"";
  const canApproveThis=CAN_APPROVE&&e.personId!==MY_PERSON_ID&&e.enteredBy!==MY_PERSON_ID;
  let foot="";
  if(canApproveThis) foot = locked
      ? `<button class='appr unappr' onclick="tsUnapprove('${e.id}')">✓ Approved — tap to unlock</button>`
      : `<button class='appr' onclick="tsApprove('${e.id}')">Approve</button>`;
  else if(locked) foot = `<span class='lockbadge'>✓ Approved — locked</span>`;
  let stamp="";
  if(CAN_APPROVE){const en=(person(e.enteredBy)||{}).name, ap=e.approved?(person(e.approvedBy)||{}).name:"";
    if(en)stamp+=`entered: ${esc(en)}`; if(ap)stamp+=`${en?" · ":""}approved: ${esc(ap)}`;
    if(stamp)stamp=`<div class='stamp'>${stamp}</div>`;}
  foot=stamp+foot;
  return `<div class='line ${cls} ${locked?"locked":""}'>
    <select class='alloc' ${dis} onchange="tsSetAlloc('${e.id}',this.value)">${allocOpts(e.alloc)}</select>
    <div class='l2'>
      <span class='hwrap'><label>hrs</label><input class='hrs' ${dis} type='number' inputmode='decimal' min='0' step='0.25' value='${e.hours}' onchange="tsSetHours('${e.id}',this.value)"></span>
      <input class='note' ${dis} placeholder='note (optional)' value='${esc(e.note)}' onchange="tsSetNote('${e.id}',this.value)">
      ${locked?"":`<button class='del' onclick="tsDel('${e.id}')">remove</button>`}
    </div>${foot}</div>`;
}

function renderTotals(){
  let lab=0,mat=0,hrs=0;S.tasks.forEach(t=>{const l=labourForTask(t.id);lab+=l.cost;hrs+=l.hours;mat+=materialForTask(t.id);});
  const w=wastageTotals(),unal=unallocatedHours(),total=lab+mat+w.cost;
  document.getElementById("kpis").innerHTML=`
    <div class='k'><div class='lbl'>Total cost</div><div class='v'>${fmt(total)}</div><div class='t'>incl. wastage</div></div>
    <div class='k'><div class='lbl'>Labour</div><div class='v'>${fmt(lab)}</div><div class='t'>${fmt1(hrs)} h</div></div>
    <div class='k'><div class='lbl'>Materials</div><div class='v'>${fmt(mat)}</div></div>
    <div class='k warn'><div class='lbl'>Wastage</div><div class='v'>${fmt(w.cost)}</div><div class='t'>${fmt1(w.hours)} h${unal?` · ${fmt1(unal)} unalloc`:""}</div></div>`;

  const ws=weeksSorted();
  let it="";
  ZONES.forEach(z=>{
    const tasksWith=S.tasks.filter(t=>t.zone===z&&labourForTask(t.id).hours>0);
    if(!tasksWith.length)return;
    it+=`<div class='zhead'><span class='pill ${z}'>${z}</span></div>`;
    tasksWith.forEach(t=>{
      const l=labourForTask(t.id);
      let chips=ws.map(wk=>{const hh=taskWeekHours(t.id,wk.id);return hh?`<span class='chip'>${prettyDate(wk.monday)}: ${fmt1(hh)}h</span>`:"";}).join("");
      it+=`<div class='item'><div class='top2'><span class='nm'>${esc(t.name)}</span><span class='tot'>${fmt1(l.hours)} h</span></div>
        <div class='small muted'>${fmt(l.cost+materialForTask(t.id))} total</div><div class='wk'>${chips}</div></div>`;
    });
  });
  if(w.hours>0){
    let chips=ws.map(wk=>{const hh=taskWeekHours("WASTAGE",wk.id);return hh?`<span class='chip' style='background:var(--warn-soft);color:var(--warn)'>${prettyDate(wk.monday)}: ${fmt1(hh)}h</span>`:"";}).join("");
    it+=`<div class='zhead'><span class='pill W'>Wastage</span></div><div class='item'><div class='top2'><span class='nm'>Wastage</span><span class='tot'>${fmt1(w.hours)} h</span></div><div class='wk'>${chips}</div></div>`;
  }
  if(!it)it="<div class='card muted'>No hours entered yet.</div>";
  document.getElementById("itemTotals").innerHTML=it;

  let pt="";
  S.people.forEach(p=>{let th=0,wh=0;S.timesheet.forEach(e=>{if(e.personId===p.id){th+=+e.hours||0;if(e.alloc==="WASTAGE")wh+=+e.hours||0;}});
    if(th>0)pt+=`<div class='item'><div class='top2'><span class='nm'>${esc(p.name)}</span><span class='tot'>${fmt1(th)} h</span></div>
      <div class='small muted'>${fmt(th*(+p.rate||0))} · wastage ${th?Math.round(wh/th*100):0}%</div></div>`;});
  if(!pt)pt="<div class='card muted'>No hours yet.</div>";
  document.getElementById("personTotals").innerHTML=pt;
}

function renderMore(){
  let h="";
  S.people.forEach((p,i)=>{
    const editable=p.level<MY_LEVEL;
    if(editable){
      let opts="";for(let l=1;l<MY_LEVEL;l++)opts+=`<option value="${l}" ${p.level===l?"selected":""}>${ROLE_NAMES[l]}</option>`;
      h+=`<div class='prow'>
        <input class='nm' value='${esc(p.name)}' onchange="setPerson(${i},'name',this.value)">
        ${CAN_SEE_COSTS?`<input class='rate' type='number' inputmode='decimal' value='${p.rate}' onchange="setPerson(${i},'rate',this.value)" title='rate $/h'>`:""}
        <select class='rate' style='width:auto' onchange="setPerson(${i},'level',this.value)">${opts}</select>
        <button class='del' style='border:none;background:none;color:var(--warn)' onclick="delPerson(${i})">✕</button></div>`;
    }else{
      h+=`<div class='prow'><span class='nm'>${esc(p.name)}${p.id===MY_PERSON_ID?" (you)":""}</span><span class='small muted'>${ROLE_NAMES[p.level]||""}</span></div>`;
    }
  });
  document.getElementById("peopleList").innerHTML=h||"<div class='muted small'>No people yet.</div>";
  document.getElementById("weekList").innerHTML=weeksSorted().map(w=>"w/c "+w.monday).join(" · ")||"No weeks yet.";
}

/* ===== actions ===== */
function tsFind(id){return S.timesheet.find(e=>e.id===id);}
function tsAdd(date){let pid=SEL.personId;if(pid==="ALL"){pid=(S.people.find(p=>p.active)||{}).id;if(!pid){banner("Add a person first (More tab).");return;}}
  const e={id:uuid(),personId:pid,weekId:SEL.weekId,date,alloc:"",hours:0,note:"",enteredBy:MY_PERSON_ID};S.timesheet.push(e);renderTS();dbInsert("timesheet_entries",tsRow(e));}
function tsAddFor(pid,date){if(!pid)return;const e={id:uuid(),personId:pid,weekId:SEL.weekId,date,alloc:"",hours:0,note:"",enteredBy:MY_PERSON_ID};S.timesheet.push(e);renderTS();dbInsert("timesheet_entries",tsRow(e));}
function tsDel(id){S.timesheet=S.timesheet.filter(e=>e.id!==id);renderTS();dbDelete("timesheet_entries",id);}
function tsSetAlloc(id,v){const e=tsFind(id);e.alloc=v;e.enteredBy=MY_PERSON_ID;renderTS();dbUpdate("timesheet_entries",id,{task_id:(v&&v!=="WASTAGE")?v:null,is_wastage:v==="WASTAGE"});}
function tsSetHours(id,v){const e=tsFind(id);e.hours=+v||0;e.enteredBy=MY_PERSON_ID;renderTS();dbUpdate("timesheet_entries",id,{hours:e.hours});}
function tsSetNote(id,v){const e=tsFind(id);e.note=v;e.enteredBy=MY_PERSON_ID;renderTS();dbUpdate("timesheet_entries",id,{note:v||null});}
function tsSetPerson(id,pid){const e=tsFind(id);e.personId=pid;e.enteredBy=MY_PERSON_ID;renderTS();dbUpdate("timesheet_entries",id,{person_id:pid});}
function tsApprove(id){const e=tsFind(id);if(!CAN_APPROVE||!e||e.personId===MY_PERSON_ID||e.enteredBy===MY_PERSON_ID)return;e.approved=true;e.approvedBy=MY_PERSON_ID;renderTS();dbUpdate("timesheet_entries",id,{approved:true,approved_by:MY_PERSON_ID,approved_at:new Date().toISOString()});}
function tsUnapprove(id){const e=tsFind(id);if(!CAN_APPROVE||!e||e.personId===MY_PERSON_ID||e.enteredBy===MY_PERSON_ID)return;e.approved=false;e.approvedBy=null;renderTS();dbUpdate("timesheet_entries",id,{approved:false,approved_by:null,approved_at:null});}

function setPerson(i,k,v){const p=S.people[i];
  if(p.level>=MY_LEVEL){alert("You can only change people below your level.");renderMore();return;}
  if(k==="rate")v=+v||0;
  if(k==="level"){v=+v||1;if(v>=MY_LEVEL){alert("You can only set a level below your own.");renderMore();return;}}
  p[k]=v;dbUpdate("people",p.id,{name:p.name,hourly_rate:+p.rate||0,role_level:p.level});
  if(k==="name"||k==="level")render();}
function delPerson(i){const p=S.people[i];if(!confirm("Delete "+p.name+"? Their hours are removed too."))return;S.people.splice(i,1);S.timesheet=S.timesheet.filter(e=>e.personId!==p.id);dbDelete("people",p.id);render();}

/* ===== wiring ===== */
document.getElementById("selPerson").onchange=e=>{SEL.personId=e.target.value;localStorage.setItem("ac_person",SEL.personId);renderTS();};
document.getElementById("wkPrev").onclick=()=>stepWeek(-1);
document.getElementById("wkNext").onclick=()=>stepWeek(1);
function stepWeek(d){const ws=weeksSorted();let i=ws.findIndex(w=>w.id===SEL.weekId);if(i<0)i=ws.length-1;i+=d;
  if(i<0||i>=ws.length){banner(d<0?"No earlier week.":"No later week — add one in More.");return;}
  SEL.weekId=ws[i].id;localStorage.setItem("ac_week",SEL.weekId);renderTS();}

document.getElementById("addPerson").onclick=()=>{const p={id:uuid(),name:"New person",rate:50,role:"",active:true,level:1,user_id:null};S.people.push(p);
  dbInsert("people",{id:p.id,project_id:PROJECT_ID,name:p.name,role:null,hourly_rate:50,active:true,role_level:1});render();};
document.getElementById("addWeek").onclick=()=>{const d=prompt("Week commencing — Monday (YYYY-MM-DD):");if(!d)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return alert("Use YYYY-MM-DD");if(S.weeks.some(w=>w.monday===d))return alert("Week already exists.");
  const w={id:uuid(),monday:d};S.weeks.push(w);SEL.weekId=w.id;localStorage.setItem("ac_week",w.id);dbInsert("weeks",{id:w.id,project_id:PROJECT_ID,monday:d});renderMore();};
document.getElementById("reload").onclick=async()=>{showLoading(true);await loadAll();render();showLoading(false);banner("Reloaded.");};
document.getElementById("signout").onclick=async()=>{await sb.auth.signOut();location.reload();};
document.getElementById("topSignout").onclick=async()=>{await sb.auth.signOut();location.reload();};
document.getElementById("csvTs").onclick=()=>{let rows=[["Date","Day","Person","Allocation","Zone","Hours","Rate","Labour $","Note"]];
  [...S.timesheet].sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{const p=person(e.personId);
    const al=e.alloc==="WASTAGE"?"Wastage":((task(e.alloc)||{}).name||"(unallocated)");const zone=e.alloc==="WASTAGE"?"":((task(e.alloc)||{}).zone||"");
    const dn=DAYNAMES[(new Date(e.date).getDay()+6)%7];
    rows.push([e.date,dn,(p||{}).name||"",al,zone,e.hours,(p||{}).rate||0,((+e.hours||0)*((p||{}).rate||0)).toFixed(2),e.note||""]);});
  dl("timesheet.csv",rows);};
document.getElementById("csvCost").onclick=()=>{let rows=[["Zone","Task","Hours","Labour","Material","Total"]];
  ZONES.forEach(z=>S.tasks.filter(t=>t.zone===z).forEach(t=>{const l=labourForTask(t.id);const m=materialForTask(t.id);
    rows.push([z,t.name,l.hours,l.cost.toFixed(2),m.toFixed(2),(l.cost+m).toFixed(2)]);}));
  const w=wastageTotals();rows.push(["","Wastage",w.hours,w.cost.toFixed(2),"0.00",w.cost.toFixed(2)]);dl("costing.csv",rows);};
function dl(name,rows){const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const b=new Blob([csv],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}

document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  CUR=b.dataset.s;
  document.querySelectorAll("nav.bottom button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById("s-"+CUR).classList.add("active");
  window.scrollTo(0,0);render();});

/* ===== auth + boot ===== */
function showLoading(on){document.getElementById("loading").style.display=on?"flex":"none";}
function showLogin(on){document.getElementById("login").style.display=on?"flex":"none";}
function applyRole(){
  const tot=document.querySelector('nav.bottom button[data-s="tot"]');
  const more=document.querySelector('nav.bottom button[data-s="more"]');
  if(tot)tot.style.display=CAN_SEE_COSTS?"":"none";   // Totals shows costs -> PM+
  if(more)more.style.display=CAN_APPROVE?"":"none";   // people mgmt -> foreman+
  ["addWeek","csvTs","csvCost"].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=CAN_SEE_COSTS?"":"none";});
  if(!CAN_APPROVE||(CUR==="tot"&&!CAN_SEE_COSTS)){
    CUR="ts";
    document.querySelectorAll("nav.bottom button").forEach(x=>x.classList.toggle("active",x.dataset.s==="ts"));
    document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id==="s-ts"));
  }
}
async function start(session){showLogin(false);showLoading(true);
  MY_UID=(session&&session.user&&session.user.id)||null;
  document.getElementById("who").textContent=(session&&session.user&&session.user.email)||"";
  const ok=await loadAll();
  if(ok){
    const me=S.people.find(p=>p.user_id&&p.user_id===MY_UID);
    MY_LEVEL=me?me.level:0; MY_PERSON_ID=me?me.id:null;
    IS_ADMIN=MY_LEVEL>=4; CAN_SEE_COSTS=MY_LEVEL>=3; CAN_APPROVE=MY_LEVEL>=2;
    if(!CAN_APPROVE&&MY_PERSON_ID){SEL.personId=MY_PERSON_ID;localStorage.setItem("ac_person",MY_PERSON_ID);}
    applyRole();
    render();
  }
  showLoading(false);}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  document.getElementById("loginErr").textContent="";document.getElementById("loginBtn").disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  document.getElementById("loginBtn").disabled=false;
  if(error){document.getElementById("loginErr").textContent=error.message;return;}start(data.session);});
(async function boot(){showLoading(true);
  try{const {data}=await sb.auth.getSession();if(data&&data.session){await start(data.session);}else{showLoading(false);showLogin(true);}}
  catch(e){showLoading(false);showLogin(true);}
})();
</script>
</body>
</html>
